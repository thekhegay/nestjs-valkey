name: ✨ Feature request
description: Propose an option, a runner or a behaviour
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the API. Check the "Not included" list in the README first: some things are left out on purpose.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today? A concrete case helps.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it should work from your application. Pseudo-code is fine.
      render: ts
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched [existing issues](https://github.com/thekhegay/nestjs-valkey/issues) and found no duplicate
          required: true
        - label: I am willing to open a pull request for this
          required: false
