name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml dispatches this on the release branch: a GITHUB_TOKEN pull request starts no run
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request' || github.ref_name != 'main'
        run: node scripts/check-commits.mjs "origin/$BASE..$HEAD_SHA"
        env:
          BASE: ${{ github.base_ref || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm check:package
      - if: startsWith(github.head_ref || github.ref_name, 'release/')
        run: pnpm release:check

  servers:
    name: servers (valkey ${{ matrix.valkey }}, redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - valkey: '7.2'
            redis: '7.0'
          - valkey: '8.1'
            redis: '7.0'
          - valkey: '9.1'
            redis: '8'
    env:
      VALKEY_IMAGE: valkey/valkey:${{ matrix.valkey }}-alpine
      REDIS_IMAGE: redis:${{ matrix.redis }}-alpine
      REDIS_URL: redis://127.0.0.1:16380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker/compose.yml --profile redis up -d --wait
      - run: pnpm test:servers
      - if: failure()
        run: docker compose -f docker/compose.yml --profile redis logs
      - if: always()
        run: docker compose -f docker/compose.yml --profile redis down --volumes

  glide-floor:
    name: servers (glide 2.0.1, the lowest the peer range allows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @valkey/valkey-glide@2.0.1
      - run: docker compose -f docker/compose.yml up -d --wait
      - run: pnpm typecheck
      - run: pnpm test:servers
      - if: always()
        run: docker compose -f docker/compose.yml down --volumes

  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0
      - run: echo "NODE_20=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - run: echo "NODE_22=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: echo "NODE_26=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: echo "NODE_24=$(which node)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker/compose.yml up -d --wait valkey
      - run: pnpm test:consumers
        env:
          CONSUMER_NODES: 20.19.0=${{ env.NODE_20 }},22.12.0=${{ env.NODE_22 }},24=${{ env.NODE_24 }},26=${{ env.NODE_26 }}
      - if: always()
        run: docker compose -f docker/compose.yml down --volumes

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

  passed:
    name: CI passed
    if: always()
    needs: [check, servers, glide-floor, consumers, workflows]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
