name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Cut release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump the version and write the changelog
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: pnpm release:prepare "--bump=$BUMP"

      - name: Write the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:body "--output=$RUNNER_TEMP/release-body.md"

      - name: Create release PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          base: main
          delete-branch: true
          add-paths: |
            package.json
            CHANGELOG.md
          commit-message: 'chore(release): v${{ steps.bump.outputs.version }}'
          title: 'chore(release): v${{ steps.bump.outputs.version }}'
          body-path: ${{ runner.temp }}/release-body.md
          labels: |
            release
            release:stable

      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/v${{ steps.bump.outputs.version }}
        run: gh workflow run ci.yml --ref "$BRANCH"
